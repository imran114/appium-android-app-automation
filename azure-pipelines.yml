trigger:
  - main

pool:
  name: 'Default'
  demands:
    - agent.os -equals Darwin

variables:
  ANDROID_DEVICE_UDID: 'RFCT81AXXRM'
  APPIUM_PORT: 4723
  JAVA_HOME: '/Users/evamp-saanga/Library/Java/JavaVirtualMachines/ms-17.0.15/Contents/Home'
  ANDROID_HOME: '/Users/evamp-saanga/Library/Android/sdk'
  MAVEN_OPTS: '-Xmx3072m'

jobs:
  - job: QA
    displayName: 'Android Automation QA'
    steps:

      # Step 1: Verify Android device is connected
      - script: |
          export ANDROID_HOME='/Users/evamp-saanga/Library/Android/sdk'
          export PATH="$ANDROID_HOME/platform-tools:/usr/local/bin:$PATH"
          adb kill-server
          adb start-server
          sleep 3
          echo "Connected devices:"
          adb devices
        displayName: 'Verify Android device connection'

      # Step 2: Start Appium server with device-farm plugin
      - script: |
          export ANDROID_HOME='/Users/evamp-saanga/Library/Android/sdk'
          export PATH="$ANDROID_HOME/platform-tools:/usr/local/bin:$PATH"
          echo "Starting Appium server with device-farm plugin..."
          appium server -ka 800 --use-plugins=device-farm -pa /wd/hub --plugin-device-farm-platform=android &
          sleep 10
          echo "Appium started"
        displayName: 'Start Appium server'

      # Step 3: Run Maven automation tests
      - script: |
          export ANDROID_HOME='/Users/evamp-saanga/Library/Android/sdk'
          export PATH="$ANDROID_HOME/platform-tools:/usr/local/bin:$PATH"
          export JAVA_HOME='/Users/evamp-saanga/Library/Java/JavaVirtualMachines/ms-17.0.15/Contents/Home'
          mvn -f pom.xml test -Dsurefire.suiteXmlFiles=testNGSuite.xml
        displayName: 'Run Android automation tests'

      # Step 4: Stop Appium after tests
      - script: |
          echo "Stopping Appium server..."
          pkill -f appium || true
        displayName: 'Stop Appium server'
        condition: always()

      # Step 5: Publish test results
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '**/surefire-reports/TEST-*.xml'
          searchFolder: '$(System.DefaultWorkingDirectory)'
          failTaskOnFailedTests: true
          testRunTitle: 'Android Automation Tests'
        displayName: 'Publish test results'
        condition: always()

      # Step 6: Upload Appium logs as artifact
      # - task: PublishBuildArtifacts@1
      #   inputs:
      #     pathToPublish: 'appium.log'
      #     artifactName: 'AppiumLogs'
      #   displayName: 'Upload Appium logs'
      #   condition: always()